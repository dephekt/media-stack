# =============================================================================
#  2x4 Brain - REVISED config for the KinCony KC868-A6
#  ESPHome crop-steering / fertigation controller
#
#  This is a review rewrite. See CHANGES.md for the full change list mapped to
#  your requests. Highlights:
#   - Never reboots on HA/Wi-Fi loss (reboot_timeout: 0s), runs on SNTP + DS1307
#     RTC so timekeeping is HA-independent.
#   - Maintenance mode + lights-on/off + P2-window-close are now LOCAL ESPHome
#     entities (a switch + three `datetime` time entities), not pulled from HA.
#   - Lights scripts fire on a minute match, with a boot/resync catch-up that
#     runs lights-on if it's already past lights-on time and today's run was missed.
#   - P1/P2 event scripts rewritten (no hanging pump-confirm loops); they SKIP
#     cleanly instead of hanging when HA is down. New P3 emergency-shot event.
#   - VPD math and P1/P2 shot math de-duplicated into fragments/ via !include.
#   - Flash-friendly: transient counters no longer restore_value.
#
#  Validate on your machine before flashing:  esphome config 2x4-brain.yaml
# =============================================================================

substitutions:
  # The irrigation pump is on a Home-Assistant-controlled plug. This is the one
  # thing that still needs HA. To make watering fully HA-independent, wire the
  # pump to a spare board relay and swap the two homeassistant.service calls in
  # the `shot` script for `switch.turn_on/off: <relay>`.
  switch_irrigation_pump: "switch.pump_valve"

# >>> CHANGED: the copy-pasted VPD (x6) and P1/P2 shot-math (x4) lambdas are now
# two shared fragments, pulled in per sensor/phase as packages. Package list
# values are concatenated, so each fragment's sensors are appended to `sensor:`.
packages:
  vpd_scd41: !include { file: fragments/vpd.yaml, vars: { prefix: "SCD41", tid: scd41temp,        hid: scd41hum,      vpd_id: scd41vpd, leaf_id: scd41vpdleaf } }
  vpd_sht41: !include { file: fragments/vpd.yaml, vars: { prefix: "SHT41", tid: Temperaturesht41, hid: Humiditysht41,  vpd_id: sht41vpd, leaf_id: sht41vpdleaf } }
  vpd_aht10: !include { file: fragments/vpd.yaml, vars: { prefix: "AHT10", tid: Temperatureaht10, hid: Humidityaht10,  vpd_id: aht10vpd, leaf_id: aht10vpdleaf } }
  shot_p1:   !include { file: fragments/shot_calc.yaml, vars: { prefix: "P1", size_id: p1_shot_size, time_id: p1_irrigation_time, vol_id: p1_shot_volume } }
  shot_p2:   !include { file: fragments/shot_calc.yaml, vars: { prefix: "P2", size_id: p2_shot_size, time_id: p2_irrigation_time, vol_id: p2_shot_volume } }

esphome:
  name: "2x4-brain"
  friendly_name: 2x4 Brain
  on_boot:
    then:
      - script.execute: bootupscript
      - ds1307.read_time:        # load RTC into system time immediately (valid before Wi-Fi/HA)

esp32:
  board: esp32dev
  framework:
    type: esp-idf

preferences:
  # Batches NVS writes; the churny state globals only hit flash once an hour.
  flash_write_interval: 60min

logger:
  level: INFO                    # >>> CHANGED: was VERBOSE (constant serial flood + CPU)
  logs:
    modbus_controller.sensor: WARN
    modbus_controller: WARN
    mod_ph: INFO
  on_message:
    level: WARN                  # >>> CHANGED: only warnings/errors go to the HA text_sensor (was every DEBUG line)
    then:
      - lambda: |-
          id(esp_log).publish_state(message);

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s             # >>> CHANGED: never reboot just because HA disconnected

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s             # >>> CHANGED: never reboot on Wi-Fi loss; keep running on the RTC
  ap:
    ssid: "2X4-Brain Fallback Hotspot"
    password: !secret wifi_password

captive_portal:
web_server:
  port: 80                       # local control/monitoring even with no HA
  ota: false

# -----------------------------------------------------------------------------
# Globals (restore state across reboots)
# -----------------------------------------------------------------------------
globals:
  - id: g_p3_end_wc
    type: float
    restore_value: yes
    initial_value: '0'
  - id: g_p3_start_wc
    type: float
    restore_value: yes
    initial_value: '0'
  - id: g_p3_wc_at_lights_on
    type: float
    restore_value: yes
    initial_value: '0'
  - id: g_p3_wc_at_lights_off
    type: float
    restore_value: yes
    initial_value: '0'
  - id: g_p1_at_field_capacity
    type: bool
    restore_value: yes
  - id: g_field_capacity
    type: float
    initial_value: '0'
    restore_value: yes
  - id: g_p1_runoff_wc
    type: float
    restore_value: yes
    initial_value: '0'
  - id: g_last_high
    type: float
    restore_value: yes
    initial_value: '0'
  - id: g_last_low
    type: float
    restore_value: yes
    initial_value: '0'
  # >>> NEW: day-of-year that lights-on last ran, for the boot/resync catch-up.
  - id: g_lights_on_ran
    type: int
    restore_value: yes
    initial_value: '-1'
  # >>> NEW: earliest millis() at which the next P2 shot is allowed (frequency
  # gate). Not restored: after a reboot we simply allow the next shot immediately.
  - id: g_next_p2_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

external_components:
  - source:
      type: git
      url: https://github.com/u-fire/ESPHomeComponents/

uart:
  - id: rs485
    tx_pin: GPIO27
    rx_pin: GPIO14
    baud_rate: 4800
    stop_bits: 1
  - id: rs232        # kept (unused for now, reserved for later)
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

modbus:
  id: modbus1
  uart_id: rs485

modbus_controller:
  - id: thcs1
    update_interval: 20s
    address: 0x1
    command_throttle: 100ms
    setup_priority: -2
    modbus_id: modbus1
  - id: thcs2
    update_interval: 20s
    address: 0x2
    command_throttle: 100ms
    setup_priority: -1
    modbus_id: modbus1

spi:                 # kept (unused for now, reserved for later)
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

i2c:
  sda: GPIO4
  scl:
    number: GPIO15
    ignore_strapping_warning: true   # board-mandated pinout on the KC868-A6

one_wire:
  - platform: gpio
    pin: GPIO32

output:
  - platform: esp32_dac
    pin: GPIO26
    id: dac_output1
  - platform: esp32_dac
    pin: GPIO25
    id: dac_output2

light:
  # 0-10V-style dimmers for the grow lights (via the DAC + your external buffer).
  - platform: monochromatic
    id: light1
    output: dac_output1
    gamma_correct: 2
    name: "Dimmer 1"
  - platform: monochromatic
    id: light2
    output: dac_output2
    gamma_correct: 2
    name: "Dimmer 2"

pcf8574:
  - id: inputs
    address: 0x22
  - id: outputs
    address: 0x24

# -----------------------------------------------------------------------------
# Time  >>> CHANGED: HA time platform replaced with SNTP; DS1307 kept as the RTC
# so the clock survives reboots and Wi-Fi/HA outages. The once-a-minute tick now
# compares against the LOCAL datetime entities (minute granularity) and does the
# boot/resync catch-up.
# -----------------------------------------------------------------------------
time:
  - platform: sntp
    id: es_time
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              auto now = id(es_time).now();
              if (!now.is_valid()) return;
              int nowmin = now.hour * 60 + now.minute;
              int today  = now.day_of_year;
              int on   = id(lights_on).hour        * 60 + id(lights_on).minute;
              int off  = id(lights_off).hour       * 60 + id(lights_off).minute;
              int p2c  = id(p2_window_close).hour  * 60 + id(p2_window_close).minute;

              // "Day" window, tolerant of a schedule that wraps past midnight.
              bool in_day = (on <= off) ? (nowmin >= on && nowmin < off)
                                        : (nowmin >= on || nowmin < off);

              // Daily edge triggers (fire on the matching minute)
              if (nowmin == on)  id(lightsonscript).execute();
              if (nowmin == off) id(lightsoffscript).execute();
              if (nowmin == p2c) id(startP3).execute();

              // Catch-up: it's daytime but lights-on hasn't run today (e.g. we
              // booted after lights-on, or missed the minute). lightsonscript
              // sets g_lights_on_ran, so this fires at most once per day.
              if (in_day && id(g_lights_on_ran) != today) {
                ESP_LOGI("time", "Catch-up: past lights-on, running lights-on");
                id(lightsonscript).execute();
              }
              // Booted during the night and not already in P3 -> settle into P3.
              if (!in_day && id(irrigation_phase).state != "P3") {
                ESP_LOGI("time", "Catch-up: outside day window, settling into P3");
                id(lightsoffscript).execute();
              }

              // P1 shot cadence (guarded against divide-by-zero)
              int freq = (int) id(p1_frequency).state;
              if (freq > 0 && (now.minute % freq) == 0
                  && id(irrigation_phase).state == "P1") {
                id(p1event).execute();
              }
    on_time_sync:
      then:
        - ds1307.write_time:     # keep the RTC accurate whenever SNTP syncs
  - platform: ds1307
    id: rtc_time

# -----------------------------------------------------------------------------
# Local schedule entities  >>> NEW: lights-on/off + P2 window close as on-device
# `datetime` time entities (settable from the dashboard / web UI, restored across
# reboots). Replaces the HA input_datetime text_sensors.
# -----------------------------------------------------------------------------
datetime:
  - platform: template
    id: lights_on
    name: "Lights On"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"
    entity_category: config
  - platform: template
    id: lights_off
    name: "Lights Off"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    entity_category: config
  - platform: template
    id: p2_window_close
    name: "P2 Window Close"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "20:00:00"
    entity_category: config

