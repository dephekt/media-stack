# =============================================================================
#  Scripts
# =============================================================================
script:
  # --- Restore state on boot ---
  - id: bootupscript
    mode: single
    then:
      - lambda: |-
          id(last_low).publish_state(id(g_last_low));
          id(last_high).publish_state(id(g_last_high));
          id(p1_runoff_wc).publish_state(id(g_p1_runoff_wc));
          id(field_capacity).publish_state(id(g_field_capacity));
          id(p3_wc_at_lights_off).publish_state(id(g_p3_wc_at_lights_off));
          id(p3_wc_at_lights_on).publish_state(id(g_p3_wc_at_lights_on));
          id(p3_start_wc).publish_state(id(g_p3_start_wc));
          id(p3_end_wc).publish_state(id(g_p3_end_wc));
          id(p1_at_field_capacity).publish_state(id(g_p1_at_field_capacity));
      - logger.log: "Booted; state restored"

  # --- One shared pump shot. Pump is on the HA plug (see substitutions note).
  #     No confirm loops -> this can never hang. If HA drops mid-shot, the turn-off
  #     may not land, but your plug + HA auto-off is the stuck-pump safety net. ---
  - id: shot
    parameters:
      seconds: float
    mode: single
    then:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: ${switch_irrigation_pump}
      - delay: !lambda "return (uint32_t)(seconds * 1000.0f);"
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: ${switch_irrigation_pump}
      - number.increment: daily_irrigation_events    # every shot counts once here

  # --- Lights on: start the day ---
  - id: lightsonscript
    mode: single
    then:
      - lambda: |-
          id(p3_wc_at_lights_on).publish_state(id(VWC).state);
          if (id(es_time).now().is_valid())
            id(g_lights_on_ran) = id(es_time).now().day_of_year;   // mark done for today
          auto c1 = id(daily_irrigation_events).make_call(); c1.number_to_min(); c1.perform();
          auto c2 = id(p1_shot_count).make_call();          c2.number_to_min(); c2.perform();
          id(total_daily_ml_estimate).publish_state(0);
          id(p1_at_field_capacity).publish_state(false);
      - select.set: { id: irrigation_phase, option: "P0" }

  # --- Lights off: begin overnight P3 dryback ---
  - id: lightsoffscript
    mode: single
    then:
      - lambda: |-
          id(p3_wc_at_lights_off).publish_state(id(VWC).state);
          id(p3_start_wc).publish_state(id(last_high).state);
          auto c = id(irrigation_phase).make_call(); c.set_option("P3"); c.perform();

  # --- P2 window closes -> into P3 (optional end-of-day shot) ---
  - id: startP3
    mode: single
    then:
      - lambda: |-
          id(p3_start_wc).publish_state(id(last_high).state);
          auto c = id(irrigation_phase).make_call(); c.set_option("P3"); c.perform();
      - if:
          condition:
            and:
              - switch.is_on: auto_water
              - switch.is_on: p2_end_shot
              - switch.is_off: maintenance_mode
              - api.connected:
          then:
            - sensor.template.publish: { id: last_low, state: !lambda 'return id(VWC).state;' }
            - logger.log: "P2-end shot to start P3"
            # counts once in daily_irrigation_events (inside shot) -- no longer double-counted as a P1 shot
            - script.execute: { id: shot, seconds: !lambda 'return id(p2_irrigation_time).state;' }

  # --- Runs on every VWC update: tracks highs/lows and drives P0/P2/P3 ---
  - id: vwc_check
    mode: single
    then:
      - lambda: |-
          float vwc = id(VWC).state;
          if (isnan(vwc)) return;
          if (vwc > id(last_high).state) id(last_high).publish_state(vwc);
          if (vwc < id(last_low).state)  id(last_low).publish_state(vwc);

          std::string phase = id(irrigation_phase).state;

          if (phase == "P0") {
            bool p0_hit    = (id(p3_wc_at_lights_on).state - vwc) >= id(p0_dryback_target).state;
            bool p3_hit    = id(currentdryback).state >= id(p3_dryback_target).state;
            bool floor_hit = vwc <= id(p3_vwc_low_limit).state;
            if (p0_hit || p3_hit || floor_hit) {
              ESP_LOGI("irrig", "P0 dryback met -> P1");
              id(p3_end_wc).publish_state(vwc);
              auto c = id(irrigation_phase).make_call(); c.set_option("P1"); c.perform();
              id(last_high).publish_state(vwc);
              id(last_low).publish_state(vwc);
            }
          }
          else if (phase == "P2") {
            if (id(auto_water).state && !id(maintenance_mode).state
                && vwc <= id(p2_min_wc_target).state
                && millis() >= id(g_next_p2_ms)) {          // frequency gate (replaces the old blocking delay)
              ESP_LOGI("irrig", "VWC <= P2 target -> P2 shot");
              id(p2event).execute();
            }
          }
          else if (phase == "P3") {
            if (id(auto_water).state && !id(maintenance_mode).state
                && vwc <= id(p3_vwc_low_limit).state) {     // >>> NEW: overnight wilt-floor safety
              ESP_LOGW("irrig", "P3 VWC below low limit -> emergency shot");
              id(p3event).execute();
            }
          }

  # --- P1 event: field-capacity detection + timed recharge shot ---
  - id: p1event
    mode: single
    then:
      - lambda: |-
          // Out of P1 shots -> P2 (lock field capacity if we never detected it)
          if (id(p1_shot_count).state >= id(p1_target_shots).state) {
            ESP_LOGI("irrig", "Out of P1 shots -> P2");
            auto c = id(irrigation_phase).make_call(); c.set_option("P2"); c.perform();
            if (!id(p1_at_field_capacity).state) {
              id(field_capacity).publish_state(id(VWC).state);
              id(p1_at_field_capacity).publish_state(true);
            }
            return;
          }
          // Field-capacity detection. The `field_capacity > 0` guard stops a
          // fresh/reset device (FC == 0) from tripping the "within 10%" test.
          bool plateau    = (id(VWC).state - id(last_low).state) <= 1.1f;
          bool near_fc     = id(field_capacity).state > 0.0f
                             && (id(field_capacity).state - id(VWC).state) <= 10.0f;
          bool used_enough = id(p1_shot_count).state > (id(p1_target_shots).state / 2.0f);
          if (plateau && near_fc && used_enough) {
            ESP_LOGI("irrig", "Hit field capacity");
            id(p1_at_field_capacity).publish_state(true);
            id(field_capacity).publish_state(id(VWC).state);
            id(p1_runoff_wc).publish_state(id(last_high).state);
            id(last_low).publish_state(id(VWC).state);
            bool generative = id(steering_phase).state == "Generative - Flip"
                           || id(steering_phase).state == "Generative - Finish";
            if (id(pw_ec).state <= id(p2_ec_target).state || generative) {
              auto c = id(irrigation_phase).make_call(); c.set_option("P2"); c.perform();
            }
          }
      # Give the P1 shot only if it's still P1, watering is on, HA is up, not in maintenance.
      - if:
          condition:
            and:
              - switch.is_on: auto_water
              - switch.is_off: maintenance_mode
              - api.connected:
              - lambda: 'return id(irrigation_phase).state == "P1";'
          then:
            - sensor.template.publish: { id: last_low, state: !lambda 'return id(VWC).state;' }
            - script.execute: { id: shot, seconds: !lambda 'return id(p1_irrigation_time).state;' }
            - number.increment: p1_shot_count
          else:
            - logger.log: "P1 shot skipped (auto_water off / HA down / maintenance / not P1)"

  # --- P2 event: maintenance shot ---
  - id: p2event
    mode: single
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_water
              - switch.is_off: maintenance_mode
              - api.connected:
              - lambda: 'return id(irrigation_phase).state == "P2";'
          then:
            - lambda: |-
                id(last_high).publish_state(id(VWC).state);
                id(last_low).publish_state(id(VWC).state);
            - script.execute: { id: shot, seconds: !lambda 'return id(p2_irrigation_time).state;' }
            # arm the frequency gate only after a shot actually fired
            - lambda: 'id(g_next_p2_ms) = millis() + (uint32_t)(id(p2_frequency).state * 60000.0f);'
          else:
            - logger.log: "P2 shot skipped (auto_water off / HA down / maintenance / not P2)"

  # --- P3 event: overnight emergency shot when VWC hits the wilt floor ---  >>> NEW
  - id: p3event
    mode: single
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_water
              - switch.is_off: maintenance_mode
              - api.connected:
              - lambda: 'return id(irrigation_phase).state == "P3";'
          then:
            - lambda: |-
                id(last_high).publish_state(id(VWC).state);
                id(last_low).publish_state(id(VWC).state);
            - script.execute: { id: shot, seconds: !lambda 'return id(p2_irrigation_time).state;' }
          else:
            - logger.log: "P3 emergency shot skipped (auto_water off / HA down / maintenance / not P3)"

  # --- pH dosing (local relays; loop is fine, it's not HA-dependent) ---
  - id: ph_dosing_script
    mode: single
    then:
      - number.set: { id: ph_dose_counter, value: 0 }
      - while:
          condition:
            and:
              - switch.is_on: auto_ph
              - switch.is_off: maintenance_mode          # >>> CHANGED: local switch, fail-safe
              - lambda: |-
                  float v = id(ph).state;
                  bool low  = v <= id(ph_goal).state - id(ph_tolerance).state;
                  bool high = v >= id(ph_goal).state + id(ph_tolerance).state;
                  bool have_doses = id(ph_dose_counter).state < id(doses_max).state;
                  return (low || high) && have_doses;
          then:
            - number.increment: ph_dose_counter
            - if:
                condition:
                  - lambda: 'return id(ph).state >= id(ph_goal).state + id(ph_tolerance).state;'
                then:
                  - switch.turn_on: relay_1
                  - delay: !lambda "return id(dosing_time).state * 1000;"
                  - switch.turn_off: relay_1
            - if:
                condition:
                  - lambda: 'return id(ph).state <= id(ph_goal).state - id(ph_tolerance).state;'
                then:
                  - switch.turn_on: relay_2
                  - delay: !lambda "return id(dosing_time).state * 1000;"
                  - switch.turn_off: relay_2
            # Wait a FULL pH update interval (15s) after dosing so the next
            # decision reads a settled value instead of re-dosing on a stale one.
            - delay: 15s
      - delay: !lambda "return id(dosing_interval).state * 2 * 1000;"

  # --- Nutrient dosing (local relays A + B). NOTE: still regulates on EC2 (a soil
  #     probe) and never pulses relay_5 (Pump C) -- flagged in the review. Left as
  #     you had it apart from the maintenance guard; wire a reservoir EC + add a
  #     relay_5 step when you're ready. ---
  - id: nutrient_dosing_script
    mode: single
    then:
      - if:
          condition:
            - switch.is_on: auto_dose
            - switch.is_off: maintenance_mode            # >>> CHANGED: local switch, fail-safe
          then:
            - number.set: { id: ec_dose_counter, value: 0 }
            - while:
                condition:
                  lambda: |-
                    float ec = id(EC2).state;
                    bool oor = ec < (id(ec_target).state - id(ec_tolerance).state)
                            || ec > (id(ec_target).state + id(ec_tolerance).state);
                    return oor && id(ec_dose_counter).state < id(ec_doses_max).state;
                then:
                  - number.increment: ec_dose_counter
                  - switch.turn_on: relay_3
                  - delay: !lambda "return id(ec_dosing_time).state * 1000;"
                  - switch.turn_off: relay_3
                  - delay: 10s
                  - switch.turn_on: relay_4
                  - delay: !lambda "return id(ec_dosing_time).state * 1000;"
                  - switch.turn_off: relay_4
                  - delay: !lambda "return id(dosing_interval).state * 1000;"
            - delay: !lambda "return id(dosing_interval).state * 2 * 1000;"
