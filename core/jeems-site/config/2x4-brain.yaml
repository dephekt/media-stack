              - not:
                  script.is_running: ph_dosing_script
            then:
              - script.execute: ph_dosing_script

  ##################################
  ## V I R T U A L  S E N S O R S ##
  ##################################

  # P1/P2 irrigation-time + shot-volume sensors come from the `packages:` block
  # at the top of this file (fragments/shot_calc.yaml).

