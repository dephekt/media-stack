    lambda: |-
      float ml_p1 = id(p1_shot_volume).state * id(plant_count).state * id(p1_shot_count).state;
      float p2_events = id(daily_irrigation_events).state - id(p1_shot_count).state;
      float ml_p2 = id(p2_shot_volume).state * id(plant_count).state * p2_events;
      return (ml_p1 + ml_p2) / 1000.0f;

