    lambda: |-
      if (id(steering_phase).state == "Generative - Flip"
          || id(steering_phase).state == "Generative - Finish")
        return id(field_capacity).state - id(p2_dryback_target).state;
      return id(p1_runoff_wc).state - id(p2_dryback_target).state;

  - platform: template
