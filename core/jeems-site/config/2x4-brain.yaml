####################################
## H A R D W A R E  S E N S O R S ##
####################################
sensor:
  # --- SCD41 CO2 / temp / hum ---
  - platform: scd4x
    automatic_self_calibration: false
    update_interval: 10s
    co2:
      name: "SCD41 CO2"
    temperature:
      name: "SCD41 Temperature"
      id: scd41temp
      on_value:
        then:
          - component.update: scd41vpd
    humidity:
      name: "SCD41 Humidity"
      id: scd41hum
      on_value:
        then:
          - component.update: scd41vpd

  # --- SHT41 temp / hum ---
  - platform: sht4x
    temperature:
      name: "sht41 Temperature"
      id: "Temperaturesht41"
      on_value:
        then:
          - component.update: sht41vpd
    humidity:
      name: "sht41 Humidity"
      id: "Humiditysht41"
      on_value:
        then:
          - component.update: sht41vpd
    update_interval: 10s

  # --- AHT10 temp / hum ---
  - platform: aht10
    temperature:
      name: "aht10 Temperature"
      id: "Temperatureaht10"
      filters:
        - median: { window_size: 10, send_every: 3, send_first_at: 1 }
      on_value:
        then:
          - component.update: aht10vpd
    humidity:
      name: "aht10 Humidity"
      id: "Humidityaht10"
      filters:
        - median: { window_size: 10, send_every: 3, send_first_at: 1 }
      on_value:
        then:
          - component.update: aht10vpd
    update_interval: 30s

  # VPD / leaf-VPD sensors for SCD41 / SHT41 / AHT10 come from the `packages:`
  # block at the top of this file (fragments/vpd.yaml).

  - platform: dallas_temp
    name: Temp Dallas
    update_interval: 30s

  ## THC-S soil sensor 1 ##
  - platform: modbus_controller
    name: "THC-S Moisture"
    id: WC
    address: 0x0000
    unit_of_measurement: "%"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - lambda: return (x / 10);
    state_class: measurement
    modbus_controller_id: thcs1
  - platform: modbus_controller
    name: "THC-S Temp"
    id: C
    address: 0x0001
    unit_of_measurement: "°C"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - lambda: return x / 10;
    state_class: measurement
    modbus_controller_id: thcs1
  - platform: modbus_controller
    name: "THC-S Conductivity"
    id: EC
    address: 0x0002
    unit_of_measurement: "us/cm"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    state_class: measurement
    modbus_controller_id: thcs1
  - platform: modbus_controller
    name: "THC-S TDS"
    disabled_by_default: True     # kept, off by default
    id: TDS
    address: 0x0004
    unit_of_measurement: "ppm"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    state_class: measurement
    modbus_controller_id: thcs1

  - platform: template
    name: "THC-S VWC"
    id: VWC
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float soil_hum = id(WC).state;
      if (isnan(soil_hum)) return {};
      return -0.0020844495456097786f * soil_hum * soil_hum
             + 0.8758395803818368f * soil_hum
             - 0.007765958483453483f;
    state_class: measurement
    unit_of_measurement: "%"
    on_value:
      then:
        - script.execute: vwc_check

  - platform: template
    name: "THC-S pwEC"
    id: pw_ec
    state_class: measurement
    unit_of_measurement: "ms/cm"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float soil_ec = id(EC).state;
      float soil_temp = id(C).state;
      float soil_hum = id(WC).state;
      if (isnan(soil_ec) || isnan(soil_temp) || isnan(soil_hum)) return {};
      soil_ec = 1.93f * soil_ec - 270.8f;
      soil_ec = soil_ec / (1.0f + 0.019f * (soil_temp - 25));
      float bulk_perm = 1.3088f + 0.1439f * soil_hum + 0.0076f * soil_hum * soil_hum;
      float pore_perm = 80.3f - 0.37f * (soil_temp - 20);
      if (bulk_perm > 4.1f)
        return (pore_perm * soil_ec) / (bulk_perm - 4.1f) / 1000.0f;   // Hilhorst 2000
      return 0;

  ## THC-S soil sensor 2 ##
  - platform: modbus_controller
    name: "THC-S 2 Moisture"
    id: WC2
    address: 0x0000
    unit_of_measurement: "%"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - lambda: return (x / 10);
    state_class: measurement
    modbus_controller_id: thcs2
  - platform: modbus_controller
    name: "THC-S 2 Temp"
    id: C2
    address: 0x0001
    unit_of_measurement: "°C"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - lambda: return x / 10;
    state_class: measurement
    modbus_controller_id: thcs2
    on_value:
      then:
        - component.update: ph
  - platform: modbus_controller
    name: "THC-S 2 Conductivity"
    id: EC2
    address: 0x0002
    unit_of_measurement: "us/cm"
